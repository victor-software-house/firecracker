%YAML 1.2
---
schema: 2
downstream:
  remote: origin
  branch: downstream
  recovery_tag_prefix: forkctl/recovery
  publish: append
upstream:
  remote: upstream
  url: https://github.com/firecracker-microvm/firecracker.git
  fetch_ref: refs/heads/firecracker-v1.18
base:
  target:
    type: tag
    selector: refs/tags/v1.18.0
    commit: eaf83bb718a559d324613d566eaf776b31a62340
    tag_object: 07a7c2e20a8f4f661702551d02fc3eca679842a5
  canonical: eaf83bb718a559d324613d566eaf776b31a62340
  stack: eaf83bb718a559d324613d566eaf776b31a62340
documents:
  ledger: PATCHES.md
  exports: patches/downstream
bookkeeping_patch: fork-tooling
patches:
  - name: pit-reinject-off
    layer: source
    purpose: >-
      KVM starts the in-kernel PIT in reinject mode, which inhibits AVIC for the
      whole VM on AMD hosts, so every interrupt and IPI exits to the host. The patch turns
      reinjection off with KVM_REINJECT_CONTROL after create_pit2.
    upstream_status: not-submitted
    drop_when: Upstream turns PIT reinjection off or makes it configurable.
    scope:
      - src/vmm/src/arch/x86_64/vm.rs
  - name: fork-tooling
    layer: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - PATCHES.md
      - patches/downstream/**
      - mise.toml
disabled_patches: []
history: []
contracts:
  allow_base: []
  required_text: []
