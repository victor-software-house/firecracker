%YAML 1.2
---
schema: 2
downstream:
  remote: origin
  branch: downstream
  recovery_tag_prefix: forkctl/recovery
  publish: append
upstream:
  remote: upstream
  url: https://github.com/firecracker-microvm/firecracker.git
  fetch_ref: refs/heads/firecracker-v1.18
base:
  target:
    type: tag
    selector: refs/tags/v1.18.0
    commit: eaf83bb718a559d324613d566eaf776b31a62340
    tag_object: 07a7c2e20a8f4f661702551d02fc3eca679842a5
  canonical: eaf83bb718a559d324613d566eaf776b31a62340
  stack: eaf83bb718a559d324613d566eaf776b31a62340
documents:
  ledger: PATCHES.md
  exports: patches/downstream
bookkeeping_patch: fork-tooling
patches:
  - name: pit-reinject-off
    layer: source
    purpose: >-
      KVM starts the in-kernel PIT in reinject mode, which inhibits AVIC for the
      whole VM on AMD hosts, so every interrupt and IPI exits to the host. The patch turns
      reinjection off with KVM_REINJECT_CONTROL after create_pit2.
    upstream_status: not-submitted
    drop_when: Upstream turns PIT reinjection off or makes it configurable.
    scope:
      - src/vmm/src/arch/x86_64/vm.rs
  - name: memslots-before-vcpus
    layer: source
    purpose: "Register memslots before vCPUs to skip KVM's SRCU wait on restore. Backport of upstream PR 6388 (commits 7b8d58a, 0ac6af3, 9585897): on Linux 6.18 or newer, a memslot update after the irqchip registers on the io bus waits for an SRCU grace period, about 20 ms on AMD hosts."
    upstream_status: merged upstream (PR 6388)
    drop_when: The fork moves to a Firecracker release that contains PR 6388.
    scope:
      - src/vmm/src/arch/aarch64/vcpu.rs
      - src/vmm/src/arch/aarch64/vm.rs
      - src/vmm/src/arch/x86_64/vm.rs
      - src/vmm/src/builder.rs
      - src/vmm/src/device_manager/mod.rs
      - src/vmm/src/device_manager/pci_mngr.rs
      - src/vmm/src/device_manager/persist.rs
      - src/vmm/src/vstate/vm.rs
  - name: thp-file-restore
    layer: source
    purpose: "Map snapshot file holes anonymously so a File restore with huge_pages Transparent gets transparent huge pages. Backport of upstream PR 6396 (commit a8e98e79): a private file mapping is never backed by THP, so each 2 MiB-aligned run of holes in the memory file is mapped anonymously and advised MADV_HUGEPAGE; data pages stay file-backed."
    upstream_status: submitted upstream (PR 6396)
    drop_when: The fork moves to a Firecracker release that contains PR 6396.
    scope:
      - src/vmm/src/vstate/memory.rs
  - name: diff-merge-zero-holes
    layer: source
    purpose: >-
      A Diff snapshot merged in place into a full memory file writes every dirty
      page, so each page the guest freed since the last snapshot (balloon free page
      reporting, inflation, hinting, or a discarded virtio-mem block) costs 4 KiB of written
      zeros and the file never shrinks. In the merge path only, dump_dirty punches a
      hole (FALLOC_FL_PUNCH_HOLE) for each run of dirty pages that read as zero instead of
      writing them. A separate diff layer still writes zeros, since a hole there means
      the page is absent.
    upstream_status: not-submitted
    drop_when: >-
      Upstream Firecracker punches holes for zero pages when a diff merges into its
      memory file.
    scope:
      - src/vmm/src/vstate/memory.rs
      - src/vmm/src/vstate/vm.rs
  - name: plug-discard-file-blocks
    layer: source
    purpose: >-
      On a guest restored from a snapshot memory file (MAP_PRIVATE), a newly plugged
      virtio-mem block is still mapped from that file, so the first write to each page
      reads the file into the page cache and copies it, charging the page cache to the
      guest cgroup, and the guest reads whatever the file holds there. The plug path
      now discards the newly plugged blocks of a private file mapping, mapping anonymous
      memory over them, and discard_range re-applies the region madvise advice so THP
      restores keep MADV_HUGEPAGE. Adds the plug_discard_fails metric.
    upstream_status: not-submitted
    drop_when: >-
      Upstream Firecracker maps newly plugged virtio-mem blocks of a file-restored
      guest anonymously, keeping the region madvise advice.
    scope:
      - src/vmm/src/vstate/memory.rs
      - src/vmm/src/devices/virtio/mem/device.rs
      - src/vmm/src/devices/virtio/mem/metrics.rs
      - tests/host_tools/fcmetrics.py
      - tests/integration_tests/performance/test_hotplug_memory.py
  - name: evict-on-save
    layer: source
    purpose: "A snapshot taken to free host memory reads every guest page back in and writes it through the host page cache, so under memory pressure the save needs the memory it is meant to free. PUT /snapshot/create takes an optional evict flag: the memory file is written with O_DIRECT (buffered with POSIX_FADV_DONTNEED where the file system refuses O_DIRECT) in 2 MiB chunks, an all-zero chunk of a full snapshot or an all-zero dirty run of a diff merged into its memory file is punched out as a hole, and each chunk is discarded from guest memory once it is written. The microVM is then marked evicted and a resume is refused. The VMM thread's seccomp filters allow the pwrite64 of each chunk, and the fallback's fadvise64 and sync_file_range with only the arguments it passes."
    upstream_status: not-submitted
    drop_when: >-
      Upstream Firecracker writes snapshot memory without the page cache and frees it
      as it goes.
    scope:
      - src/vmm/src/vstate/memory.rs
      - src/vmm/src/vstate/vm.rs
      - src/vmm/src/vmm_config/snapshot.rs
      - src/vmm/src/persist.rs
      - src/vmm/src/lib.rs
      - src/vmm/src/rpc_interface.rs
      - src/vmm/tests/integration_tests.rs
      - src/firecracker/src/api_server/request/snapshot.rs
      - src/firecracker/src/api_server/mod.rs
      - src/firecracker/swagger/firecracker.yaml
      - docs/snapshotting/snapshot-support.md
      - resources/seccomp/**
  - name: pagemap-diff
    layer: source
    purpose: >-
      A diff snapshot without dirty tracking writes the pages the guest wrote, read
      from the host page tables, so boxes can restore without dirty logging and keep 2
      MiB pages.
    upstream_status: not-submitted
    drop_when: >-
      Upstream Firecracker takes a diff snapshot without dirty tracking from the page
      tables, and its jailer gives the jailed process its own /proc.
    scope:
      - src/vmm/src/vstate/vm.rs
      - src/jailer/src/env.rs
      - src/jailer/src/main.rs
      - docs/jailer.md
      - docs/snapshotting/snapshot-support.md
  - name: fork-tooling
    layer: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - PATCHES.md
      - patches/downstream/**
      - mise.toml
disabled_patches: []
history: []
contracts:
  allow_base: []
  required_text: []
